<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шпаргалка з типів даних Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Onest:wght@600;800&display=swap">
<style>
/* Layout: tabbed cheatsheet. Sticky tab rail of types; each panel = header, properties, methods, REPL cells. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #141a24;
  --muted: #5a6476;
  --line: #dbe0e8;
  --accent: #2354c7;
  --accent-soft: #e6edfb;
  --err: #b4322b;
  --err-soft: #fbeceb;
  --ok: #1f7a4d;
  /* memory roles */
  --m-gc: #eceef2;   --m-gc-ink: #6b7384;
  --m-head: #dfe7f7; --m-head-ink: #23407f;
  --m-meta: #ece3f7; --m-meta-ink: #5a3290;
  --m-ptr: #d9f0ec;  --m-ptr-ink: #105e52;
  --m-data: #fbefc9; --m-data-ink: #7a5300;
  --m-empty: #f6f7f9; --m-empty-ink: #9aa2b1;
  --font-display: "Onest", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1218; --surface: #151b24; --ink: #e5e9f0; --muted: #98a2b4; --line: #283141;
    --accent: #86a8ff; --accent-soft: #1b2740; --err: #ff8a80; --err-soft: #3a1d1d; --ok: #6fd3a0;
    --m-gc: #1d222b; --m-gc-ink: #8d96a7;
    --m-head: #1b2a48; --m-head-ink: #a9c1f7;
    --m-meta: #2b2140; --m-meta-ink: #cdb4f5;
    --m-ptr: #12322d; --m-ptr-ink: #8fe0d1;
    --m-data: #3a2f12; --m-data-ink: #f4d27a;
    --m-empty: #181d25; --m-empty-ink: #5f6878;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1218; --surface: #151b24; --ink: #e5e9f0; --muted: #98a2b4; --line: #283141;
  --accent: #86a8ff; --accent-soft: #1b2740; --err: #ff8a80; --err-soft: #3a1d1d; --ok: #6fd3a0;
  --m-gc: #1d222b; --m-gc-ink: #8d96a7;
  --m-head: #1b2a48; --m-head-ink: #a9c1f7;
  --m-meta: #2b2140; --m-meta-ink: #cdb4f5;
  --m-ptr: #12322d; --m-ptr-ink: #8fe0d1;
  --m-data: #3a2f12; --m-data-ink: #f4d27a;
  --m-empty: #181d25; --m-empty-ink: #5f6878;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-inline: 16px; padding-block: 0 64px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
code, pre, .mono { font-family: var(--font-mono); font-size: 0.9em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* header */
.top { padding-block: 32px 18px; display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: end; justify-content: space-between; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 4.4vw, 42px); line-height: 1.05; margin: 6px 0 8px; letter-spacing: -0.01em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }
.key-legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
.key-legend span { display: inline-flex; align-items: center; gap: 6px; }

/* tabs */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  margin-inline: -16px; padding-inline: 16px;
}
.tablist { max-width: 1180px; margin: 0 auto; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tablist::-webkit-scrollbar { display: none; }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer; color: var(--muted);
  font-family: var(--font-mono); font-size: 15px; font-weight: 500;
  padding: 12px 14px 11px; border-bottom: 3px solid transparent; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 8px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; }
.dot.mut { background: currentColor; }
.tab .dot { color: var(--accent); }
.tab.compare { margin-left: auto; font-family: var(--font-body); }

/* panel header */
.panel { padding-block: 28px 0; }
.p-head { display: grid; grid-template-columns: auto 1fr; gap: 6px 28px; align-items: start; }
.p-name { font-family: var(--font-mono); font-weight: 700; font-size: clamp(44px, 8vw, 76px); line-height: 0.95; letter-spacing: -0.03em; color: var(--accent); }
.p-tag { font-size: 18px; margin: 4px 0 12px; max-width: 60ch; text-wrap: pretty; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--font-mono); font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; }
.flags { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; font-size: 13px; }
.flag { display: inline-flex; gap: 6px; align-items: baseline; }
.flag b { font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px; color: var(--muted); }
.flag .yes { color: var(--ok); font-weight: 600; }
.flag .no { color: var(--muted); }
@media (max-width: 640px) { .p-head { grid-template-columns: 1fr; } }

/* sections */
section.s { margin-top: 40px; }
.s-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 18px; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 0; letter-spacing: -0.005em; }
.s-h .sub { color: var(--muted); font-size: 13px; }
.s-h .grow { flex: 1; }

/* properties */
.props { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 18px 36px; }
.prop { min-width: 0; padding-top: 10px; border-top: 1px solid var(--line); }
.prop h3 { font-size: 15px; font-weight: 600; margin: 0 0 3px; }
.prop p { margin: 0; color: var(--muted); font-size: 14px; }
.prop code, .notes code, .m-desc code { color: var(--ink); background: var(--surface); border: 1px solid var(--line); padding: 0 4px; border-radius: 3px; font-size: 0.86em; }

/* methods */
.filter { font-family: var(--font-mono); font-size: 14px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink); width: min(100%, 16em); }
.m-group { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; color: var(--muted); margin: 22px 0 6px; }
.m-group:first-child { margin-top: 0; }
.m-row { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) minmax(0, 1.25fr); gap: 6px 24px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.m-name { font-family: var(--font-mono); font-weight: 700; font-size: 15px; }
.m-sig { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; margin-top: 2px; }
.m-desc { font-size: 14px; }
.m-empty { color: var(--muted); padding: 12px 0; }
@media (max-width: 900px) { .m-row { grid-template-columns: 1fr; } }
.m-note { font-size: 14px; color: var(--muted); margin: -6px 0 12px; }

/* code cells */
.cell { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.cell pre { margin: 0; padding: 8px 12px; overflow-x: auto; font-size: 13px; line-height: 1.5; }
.cell .res { border-top: 1px dashed var(--line); padding: 6px 12px; font-family: var(--font-mono); font-size: 13px; overflow-x: auto; white-space: pre; display: flex; gap: 8px; }
.cell .res::before { content: "→"; color: var(--muted); flex: none; }
.cell .res.err { background: var(--err-soft); color: var(--err); }
.cell .res.err::before { content: "✕"; }
.cell .stdout { padding: 4px 12px 0; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); white-space: pre; }
.cell .stdout::before { content: "виводить: "; font-family: var(--font-body); }
.cell .note { padding: 0 12px 8px; font-size: 12.5px; color: var(--muted); }
.ops { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 12px; }
.ops .cell .note { padding-top: 6px; }
.tk-k { color: var(--m-meta-ink); font-weight: 500; }
.tk-s { color: var(--ok); }
.tk-n { color: var(--m-data-ink); }
.tk-b { color: var(--accent); }
.tk-c { color: var(--muted); font-style: italic; }

/* truth table + compare */
.tbl-scroll { overflow-x: auto; }
table.t { border-collapse: collapse; font-size: 14px; width: 100%; }
table.t th, table.t td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
table.t td.n { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
table.t td.y { color: var(--ok); font-weight: 600; }
table.t td.x { color: var(--muted); }
table.t td code { font-weight: 700; }
table.t tbody tr:hover { background: var(--surface); }
.truth td { font-family: var(--font-mono); text-align: center; }
.truth th { text-align: center; }

footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
footer p { margin: 0 0 4px; max-width: 80ch; }

@media (prefers-reduced-motion: no-preference) {
  .panel { animation: rise 0.22s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="ver">CPython 3.14</div>
      <h1>Шпаргалка з типів даних Python</h1>
      <p class="lede">Що таке кожен вбудований тип, його ключові властивості та всі публічні методи з реальними результатами.</p>
    </div>
    <div class="key-legend" aria-label="Позначки вкладок">
      <span><i class="dot mut" style="color:var(--accent)"></i>змінний</span>
      <span><i class="dot" style="color:var(--accent)"></i>незмінний</span>

</div>

</div>

ь `[[0] * 3 for _ in range(3)]`."}, {"t": "Не хешований", "d": "Список не може бути ключем словника чи елементом множини. Спершу перетворіть його на кортеж."}, {"t": "Методи, що змінюють список, повертають None", "d": "`a = a.sort()` замінить ваш список на None. Пишіть `a.sort()` або `a = sorted(a)`."}], "methods": [{"name": "append", "sig": "list.append(object)", "desc": "Додає один елемент у кінець. Переданий список додається як один вкладений елемент.", "ex": "a = [1, 2]\na.append([3, 4])\na", "group": null, "out": "[1, 2, [3, 4]]", "err": false, "stdout": "", "warn": []}, {"name": "extend", "sig": "list.extend(iterable)", "desc": "Додає в кінець усі елементи з ітерованого об'єкта.", "ex": "a = [1, 2]\na.extend([3, 4])\na", "group": null, "out": "[1, 2, 3, 4]", "err": false, "stdout": "", "warn": []}, {"name": "insert", "sig": "list.insert(index, object)", "desc": "Вставляє перед заданим індексом. O(n), бо наступні елементи зсуваються.", "ex": "a = ['a', 'c']\na.insert(1, 'b')\na", "group": null, "out": "['a', 'b', 'c']", "err": false, "stdout": "", "warn": []}, {"name": "remove", "sig": "list.remove(value)", "desc": "Видаляє перший елемент, що дорівнює value. Якщо такого немає, викликає ValueError.", "ex": "a = [1, 2, 1]\na.remove(1)\na", "group": null, "out": "[2, 1]", "err": false, "stdout": "", "warn": []}, {"name": "pop", "sig": "list.pop(index=-1)", "desc": "Видаляє й повертає елемент за індексом (за замовчуванням останній). Для порожнього списку викликає IndexError.", "ex": "a = [10, 20, 30]\na.pop(), a.pop(0), a", "group": null, "out": "(30, 10, [20])", "err": false, "stdout": "", "warn": []}, {"name": "clear", "sig": "list.clear()", "desc": "Видаляє всі елементи. Інші імена того самого списку теж бачать його порожнім.", "ex": "a = [1, 2]\nb = a\na.clear()\nb", "group": null, "out": "[]", "err": false, "stdout": "", "warn": []}, {"name": "index", "sig": "list.index(value, start=0, stop=sys.maxsize)", "desc": "Позиція першого елемента, що дорівнює value. Я  2\ngrid[0][0] = 1\ngrid", "note": "пастка спільного рядка", "out": "[[1, 0], [1, 0]]", "err": false, "stdout": "", "warn": []}, {"ex": "sorted([3, 1, 2]), list(reversed([1, 2, 3]))", "note": "нові списки, оригінал не змінюється", "out": "([1, 2, 3], [3, 2, 1])", "err": false, "stdout": "", "warn": []}, {"ex": "min([4, 1, 9]), max([4, 1, 9]), sum([4, 1, 9])", "note": "мінімум, максимум, сума", "out": "(1, 9, 14)", "err": false, "stdout": "", "warn": []}, {"ex": "[n * n for n in range(6) if n % 2 == 0]", "note": "спискове включення (list comprehension)", "out": "[0, 4, 16]", "err": false, "stdout": "", "warn": []}, {"ex": "first, *rest = [1, 2, 3]\nrest", "note": "розпакування", "out": "[2, 3]", "err": false, "stdout": "", "warn": []}, {"ex": "tuple([1, 2]), list((1, 2))", "note": "list ↔ tuple", "out": "((1, 2), [1, 2])", "err": false, "stdout": "", "warn": []}]}, "dict": {"title": "dict", "tagline": "Змінне відображення унікальних хешованих ключів на значення. Пам'ятає порядок додавання.", "literals": ["{}", "{'name': 'Ann', 'age': 30}", "dict(name='Ann')", "{k: v for k, v in pairs}"], "flags": {"Змінний": true, "Хешований": false, "Впорядкований": true, "Ітерований": true}, "props": [{"t": "Хеш-таблиця", "d": "Пошук, додавання й видалення в середньому займають O(1). `key in d` перевіряє ключі, а не значення."}, {"t": "Ключі мають бути хешованими", "d": "Підходять str, int, float, кортежі з хешованих елементів і frozenset. list, dict і set — ні. Значення можуть бути будь-якими."}, {"t": "Ключі унікальні", "d": "Присвоєння за наявним ключем перезаписує значення. `1`, `1.0` і `True` вважаються тим самим ключем."}, {"t": "Порядок додавання", "d": "Гарантований з Python 3.7. Ітерація йде в тому порядку, в якому ключі вперше додали."}, {"t": "Відсутні ключі", "d": "`d['x']` викликає KeyError. Використовуйте `d.get('x')`, `'x' in d`, `setdefault` або `collections.defaultdict`."}, {"t": "Не змінюйте розмір під час ітерації", "d": "Додавання чи видалення ключів усередині `for k in d` викликає RuntimeError. Натомість ітеруйте по `list(d)`."}, {"t": "Живі представлення", "d": "`keys()`, `values()` і `items()` показують і пізніші зміни словника. Це представлення (views), а не копії."}], "methods": [{"name": "get", "sig": "dict.get(key, default=None)", "desc": "Значення для key або default, якщо ключа немає. Ніколи не викликає KeyError.", "ex": "d = {'a': 1}\nd.get('a'), d.get('z'), d.get('z', 0)", "group": null, "out": "(1, None, 0)", "err": false, "stdout": "", "warn": []}, {"name": "keys", "sig": "dict.keys()", "desc": "Живе представлення ключів. Підтримує операції множин, як-от & і -.", "ex": "{'a': 1, 'b': 2}.keys()", "group": null, "out": "dict_keys(['a', 'b'])", "err": false, "stdout": "", "warn": []}, {"name": "values", "sig": "dict.values()", "desc": "Живе представлення значень.", "ex": "{'a': 1, 'b': 2}.values()", "group": null, "out": "dict_values([1, 2])", "err": false, "stdout": "", "warn": []}, {"name": "items", "sig": "dict.items()", "desc": "Живе представлення пар (ключ, значення). Використовуйте в `for k, v in d.items()`.", "ex": "{'a': 1, 'b': 2}.items()", "group": null, "out": "dict_items([('a', 1), ('b', 2)])", "err": false, "stdout": "", "warn": []}, {"name": "update", "sig": "dict.update([other], **kwargs)", "desc": "Додає або перезаписує ключі з іншого словника, з пар (ключ, значення) або з іменованих аргументів.", "ex": "d = {'a': 1, 'b': 2}\nd.update({'b': 20}, c=3)\nd", "group": null, "out": "{'a': 1, 'b': 20, 'c': 3}", "err": false, "stdout": "", "warn": []}, {"name": "pop", "sig": "dict.pop(key[, default])", "desc": "Видаляє key і повертає його значення. Якщо ключа немає і default не задано, викликає KeyError.", "ex": "d = {'a': 1, 'b': 2}\nd.pop('a'), d.pop('z', None), d", "group": null, "out": "(1, None, {'b': 2})", "err": false, "stdout": "", "warn": []}, {"name": "popitem", "sig": "dict.popitem()", "desc": "Видаляє й повертає останню додану пару (ключ, значення). Для порожнього словника викликає KeyError.", "ex": "d = {'a': 1, 'b': 2}\nd.popitem(), d", "group": null, "out": "(('b', 2), {'a': 1})", "err": false, "stdout": "", "warn": []}, {"name": "setdefault", "sig": "dict.setdefault(key, default=None)", "desc": "Повертає значення для key. Якщо ключа немає, спершу додає його зі значенням default.", "ex": "d = {}\nd.setdefault('fruits', []).append('apple')\nd", "group": null, "out": "{'fruits': ['apple']}", "err": false, "stdout": "", "warn": []}, {"name": "clear", "sig": "dict.clear()", "desc": "Видаляє всі елементи.", "ex": "d = {'a': 1}\nd.clear()\nd", "group": null, "out": "{}", "err": false, "stdout": "", "warn": []}, {"name": "copy", "sig": "dict.copy()", "desc": "Поверхнева копія: новий словник, ті самі об'єкти-значення.", "ex": "d = {'tags': ['x']}\nc = d.copy()\nc['tags'].append('y')\nd", "group": null, "out": "{'tags': ['x', 'y']}", "err": false, "stdout": "", "warn": []}, {"name": "fromkeys", "sig": "dict.fromkeys(iterable, value=None)", "desc": "Метод класу: новий словник із заданими ключами, усі зі значенням value. Усі ключі ділять один і той самий об'єкт-значення.", "ex": "dict.fromkeys(['a', 'b'], 0)", "group": null, "out": "{'a': 0, 'b': 0}", "err": false, "stdout": "", "warn": []}], "ops": [{"ex": "d = {'name': 'Ann'}\nd['age'] = 30\nd", "note": "додати або перезаписати", "out": "{'name': 'Ann', 'age': 30}", "err": false, "stdout": "", "warn": []}, {"ex": "d = {'name': 'Ann'}\nd['email']", "note": "відсутній ключ", "out": "KeyError: 'email'", "err": true, "stdout": "", "warn": []}, {"ex": "d = {'a': 1, 'b': 2}\ndel d['a']\nd", "note": "видалення ключа", "out": "{'b': 2}", "err": false, "stdout": "", "warn": []}, {"ex": "'a' in {'a': 1}, 1 in {'a': 1}", "note": "in перевіряє ключі", "out": "(True, False)", "err": false, "stdout": "", "warn": []}, {"ex": "{'a': 1} | {'b': 2, 'a': 9}", "note": "злиття, перемагає правий бік (3.9+)", "out": "{'a': 9, 'b': 2}", "err": false, "stdout": "", "warn": []}, {"ex": "{**{'a': 1}, **{'b': 2}}", "note": "злиття через   if (i < 0) return;
  let j = null;
  if (e.key === "ArrowRight") j = (i + 1) % TABS.length;
  if (e.key === "ArrowLeft") j = (i - 1 + TABS.length) % TABS.length;
  if (e.key === "Home") j = 0;
  if (e.key === "End") j = TABS.length - 1;
  if (j !== null) { e.preventDefault(); select(TABS[j], true); $("#tab-" + TABS[j]).focus(); }
});

function select(key, user) {
  if (!TABS.includes(key)) key = TABS[0];
  TABS.forEach(k => {
    const on = k === key;
    const b = $("#tab-" + k); b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
    $("#panel-" + k).hidden = !on;
  });
  if (user) {
    try { localStorage.setItem("pytypes-tab", key); } catch (e) {}
    try { history.replaceState(null, "", "#" + key); } catch (e) {}
    const tabs = $(".tabs");
    if (tabs.getBoundingClientRect().top <= 1) window.scrollTo({ top: tabs.offsetTop, behavior: "instant" });
    $("#tab-" + key).scrollIntoView({ block: "nearest", inline: "nearest" });
  }
}
let initial = location.hash.slice(1);
if (!TABS.includes(initial)) { try { initial = localStorage.getItem("pytypes-tab") || ""; } catch (e) { initial = ""; } }
select(TABS.includes(initial) ? initial : TABS[0], false);
window.addEventListener("hashchange", () => select(location.hash.slice(1), false));
</script>
</body>
